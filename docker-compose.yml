services:
  ai:
    build:
      context: ./NETRA-AI
      dockerfile: Dockerfile
    container_name: netra-ai-service
    ports:
      - "8000:8000"
    environment:
      INTERNAL_API_URL: http://api:5000/api/potholes
      AI_MAX_RUNTIME_MS: 1200000
      TORCH_HOME: /app/.torch_cache
      YOLO_CONFIG_DIR: /tmp/Ultralytics
    volumes:
      - ./NETRA-AI/output:/app/output
      - ./NETRA-AI/input:/app/input
      - ./NETRA-AI/.torch_cache:/app/.torch_cache
    restart: unless-stopped

  api:
    build:
      context: ./netra-api
      dockerfile: Dockerfile
    container_name: netra-api-server
    ports:
      - "5000:5000"
    env_file:
      - ./netra-api/.env
    environment:
      AI_SERVICE_URL: http://ai:8000
      INTERNAL_API_URL: http://api:5000/api/potholes
    volumes:
      # Mount the AI output folder so the Express server can serve static images/videos
      - ./NETRA-AI/output:/NETRA-AI/output
    depends_on:
      - ai
    restart: unless-stopped

  web:
    build:
      context: ./netra-web
      dockerfile: Dockerfile
    container_name: netra-web-frontend
    ports:
      # Mapping your standard 5173 localhost to Nginx's internal 80
      - "5173:80"
    restart: unless-stopped

  # Note: A MongoDB service is omitted because netra-api/.env points to MongoDB Atlas in the cloud.
  # MongoDB is still external via Atlas.
